name: Build and Push Nextcloud Addon Image

# Independent of docker.yml / the main AIOStreams image: this only builds
# packages/nextcloud-addon, which has zero dependency on the rest of the
# monorepo. No "sync with upstream" step here — docker.yml already handles
# that for the whole repo.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/nextcloud-addon/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: packages/nextcloud-addon
          push: true
          tags: ghcr.io/aghermida/aiostreams-nextcloud:latest
